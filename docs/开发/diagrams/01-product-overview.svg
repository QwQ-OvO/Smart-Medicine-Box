<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">产品架构设计概览</title><desc id="desc">围绕一盒药的位置线索组织功能：先记录，后查找，再通过反馈修正。。依据 2026-10-10 当前代码，详细对照见当前产品图解文档。</desc><defs><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#177d80"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#346fa8"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a86b24"/></marker></defs><g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1440" height="1000" rx="0" fill="#fafcfc" stroke="none"/>
<text x="48" y="43" font-size="16" fill="#177d80" font-weight="600"><tspan x="48" dy="0">家庭药箱 / 当前产品设计    01</tspan></text>
<text x="48" y="89" font-size="32" fill="#203539" font-weight="700"><tspan x="48" dy="0">产品架构设计概览</tspan></text>
<text x="48" y="124" font-size="18" fill="#637679" font-weight="400"><tspan x="48" dy="0">围绕一盒药的位置线索组织功能：先记录，后查找，再通过反馈修正。</tspan></text>
<rect x="48" y="160" width="660" height="292" rx="12" fill="#edf7f6" stroke="#c8dedd"/>
<text x="72" y="196" font-size="23" fill="#177d80" font-weight="600"><tspan x="72" dy="0">A  记录与核对</tspan></text>
<text x="72" y="228" font-size="17" fill="#637679" font-weight="400"><tspan x="72" dy="0">/record · 新包装录入／已有包装补充位置</tspan></text>
<rect x="72" y="252" width="300" height="74" rx="12" fill="#fff" stroke="#177d80"/>
<text x="90" y="283" font-size="20" fill="#177d80" font-weight="600"><tspan x="90" dy="0">一句话整理</tspan></text>
<text x="90" y="313" font-size="17" fill="#203539" font-weight="400"><tspan x="90" dy="0">手工填写随时可用</tspan></text>
<rect x="384" y="252" width="300" height="74" rx="12" fill="#fff" stroke="#177d80"/>
<text x="402" y="283" font-size="20" fill="#177d80" font-weight="600"><tspan x="402" dy="0">核对草稿</tspan></text>
<text x="402" y="313" font-size="17" fill="#203539" font-weight="400"><tspan x="402" dy="0">药名、包装标签、具体位置</tspan></text>
<rect x="72" y="340" width="300" height="74" rx="12" fill="#fff" stroke="#177d80"/>
<text x="90" y="371" font-size="20" fill="#177d80" font-weight="600"><tspan x="90" dy="0">位置照片</tspan></text>
<text x="90" y="401" font-size="17" fill="#203539" font-weight="400"><tspan x="90" dy="0">每条位置可附一张照片</tspan></text>
<rect x="384" y="340" width="300" height="74" rx="12" fill="#fff" stroke="#177d80"/>
<text x="402" y="371" font-size="20" fill="#177d80" font-weight="600"><tspan x="402" dy="0">确认并保存</tspan></text>
<text x="402" y="401" font-size="17" fill="#203539" font-weight="400"><tspan x="402" dy="0">保存成功后进入位置线索</tspan></text>
<rect x="732" y="160" width="660" height="292" rx="12" fill="#edf7f6" stroke="#c8dedd"/>
<text x="756" y="196" font-size="23" fill="#177d80" font-weight="600"><tspan x="756" dy="0">B  查找与定位</tspan></text>
<text x="756" y="228" font-size="17" fill="#637679" font-weight="400"><tspan x="756" dy="0">/ → /search → /clue/:id</tspan></text>
<rect x="756" y="252" width="300" height="74" rx="12" fill="#fff" stroke="#177d80"/>
<text x="774" y="283" font-size="20" fill="#177d80" font-weight="600"><tspan x="774" dy="0">按药名搜索</tspan></text>
<text x="774" y="313" font-size="17" fill="#203539" font-weight="400"><tspan x="774" dy="0">匹配本机已保存包装</tspan></text>
<rect x="1068" y="252" width="300" height="74" rx="12" fill="#fff" stroke="#177d80"/>
<text x="1086" y="283" font-size="20" fill="#177d80" font-weight="600"><tspan x="1086" dy="0">区分同名包装</tspan></text>
<text x="1086" y="313" font-size="17" fill="#203539" font-weight="400"><tspan x="1086" dy="0">一条直达，多条手动选择</tspan></text>
<rect x="756" y="340" width="300" height="74" rx="12" fill="#fff" stroke="#177d80"/>
<text x="774" y="371" font-size="20" fill="#177d80" font-weight="600"><tspan x="774" dy="0">最近记录位置</tspan></text>
<text x="774" y="401" font-size="17" fill="#203539" font-weight="400"><tspan x="774" dy="0">展示时间、来源和照片</tspan></text>
<rect x="1068" y="340" width="300" height="74" rx="12" fill="#fff" stroke="#177d80"/>
<text x="1086" y="371" font-size="20" fill="#177d80" font-weight="600"><tspan x="1086" dy="0">无记录提示</tspan></text>
<text x="1086" y="401" font-size="17" fill="#203539" font-weight="400"><tspan x="1086" dy="0">暂无记录不代表家里没有</tspan></text>
<rect x="48" y="476" width="660" height="292" rx="12" fill="#edf7f6" stroke="#c8dedd"/>
<text x="72" y="512" font-size="23" fill="#177d80" font-weight="600"><tspan x="72" dy="0">C  反馈与历史</tspan></text>
<text x="72" y="544" font-size="17" fill="#637679" font-weight="400"><tspan x="72" dy="0">/clue/:id · /history/:id</tspan></text>
<rect x="72" y="568" width="300" height="74" rx="12" fill="#fff" stroke="#177d80"/>
<text x="90" y="599" font-size="20" fill="#177d80" font-weight="600"><tspan x="90" dy="0">在这里找到了</tspan></text>
<text x="90" y="629" font-size="17" fill="#203539" font-weight="400"><tspan x="90" dy="0">只确认本次查找结果</tspan></text>
<rect x="384" y="568" width="300" height="74" rx="12" fill="#fff" stroke="#177d80"/>
<text x="402" y="599" font-size="20" fill="#177d80" font-weight="600"><tspan x="402" dy="0">这里没找到</tspan></text>
<text x="402" y="629" font-size="17" fill="#203539" font-weight="400"><tspan x="402" dy="0">保存反馈，不推断用完</tspan></text>
<rect x="72" y="656" width="300" height="74" rx="12" fill="#fff" stroke="#177d80"/>
<text x="90" y="687" font-size="20" fill="#177d80" font-weight="600"><tspan x="90" dy="0">补充新位置</tspan></text>
<text x="90" y="717" font-size="17" fill="#203539" font-weight="400"><tspan x="90" dy="0">新增观察，保留旧位置</tspan></text>
<rect x="384" y="656" width="300" height="74" rx="12" fill="#fff" stroke="#177d80"/>
<text x="402" y="687" font-size="20" fill="#177d80" font-weight="600"><tspan x="402" dy="0">历史线索</tspan></text>
<text x="402" y="717" font-size="17" fill="#203539" font-weight="400"><tspan x="402" dy="0">位置、反馈及历史照片</tspan></text>
<rect x="732" y="476" width="660" height="292" rx="12" fill="#edf7f6" stroke="#c8dedd"/>
<text x="756" y="512" font-size="23" fill="#177d80" font-weight="600"><tspan x="756" dy="0">D  支撑能力</tspan></text>
<text x="756" y="544" font-size="17" fill="#637679" font-weight="400"><tspan x="756" dy="0">浏览器本地数据 + 后端文字解析</tspan></text>
<rect x="756" y="568" width="300" height="74" rx="12" fill="#fff" stroke="#177d80"/>
<text x="774" y="599" font-size="20" fill="#177d80" font-weight="600"><tspan x="774" dy="0">本地数据</tspan></text>
<text x="774" y="629" font-size="17" fill="#203539" font-weight="400"><tspan x="774" dy="0">Dexie / IndexedDB</tspan></text>
<rect x="1068" y="568" width="300" height="74" rx="12" fill="#fff" stroke="#177d80"/>
<text x="1086" y="599" font-size="20" fill="#177d80" font-weight="600"><tspan x="1086" dy="0">保存一致性</tspan></text>
<text x="1086" y="629" font-size="17" fill="#203539" font-weight="400"><tspan x="1086" dy="0">事务、命令去重、版本检查</tspan></text>
<rect x="756" y="656" width="300" height="74" rx="12" fill="#fff" stroke="#177d80"/>
<text x="774" y="687" font-size="20" fill="#177d80" font-weight="600"><tspan x="774" dy="0">解析服务</tspan></text>
<text x="774" y="717" font-size="17" fill="#203539" font-weight="400"><tspan x="774" dy="0">显式 Mock 或配置 Live</tspan></text>
<rect x="1068" y="656" width="300" height="74" rx="12" fill="#fff" stroke="#177d80"/>
<text x="1086" y="687" font-size="20" fill="#177d80" font-weight="600"><tspan x="1086" dy="0">草稿边界</tspan></text>
<text x="1086" y="717" font-size="17" fill="#203539" font-weight="400"><tspan x="1086" dy="0">用户确认后才写入本机</tspan></text>
<rect x="48" y="802" width="1344" height="108" rx="12" fill="#fff5e7" stroke="#a86b24"/>
<text x="66" y="833" font-size="20" fill="#a86b24" font-weight="600"><tspan x="66" dy="0">产品边界</tspan></text>
<text x="66" y="863" font-size="17" fill="#203539" font-weight="400"><tspan x="66" dy="0">无需登录；记录和照片保存在当前浏览器。没有跨设备同步、实时库存、智能硬件联动或用药推荐。</tspan></text>
<path d="M48 934 H1392" stroke="#bdcece"/>
<text x="48" y="965" font-size="16" fill="#637679" font-weight="400"><tspan x="48" dy="0">阅读顺序：模块概览 → 系统与数据流 → 查找决策 → 记录泳道</tspan></text>
<text x="1184" y="965" font-size="15" fill="#637679" font-weight="400"><tspan x="1184" dy="0">代码快照 · 2026-10-10</tspan></text>
</g></svg>
